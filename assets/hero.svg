    <rect x="65" y="22" width="9" height="7" rx="2.5" fill="#FFFFFF" opacity=".92"/>
    <rect x="41" y="46" width="9" height="7" rx="2.5" fill="#FFFFFF" opacity=".92"/>
    <rect x="16" y="84" width="56" height="9" rx="4.5" fill="#241F1B" opacity=".17"/>
    <rect x="16" y="101" width="84" height="7" rx="3.5" fill="#241F1B" opacity=".09"/>
    <rect x="16" y="115" width="60" height="7" rx="3.5" fill="#241F1B" opacity=".09"/>
