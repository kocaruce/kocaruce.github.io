<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img" aria-label="낱말 퀴즈">
  <title>낱말 퀴즈</title>
  <rect width="320" height="180" fill="#EFEBFB"/>

  <!-- 배경 장식 -->
  <circle cx="288" cy="150" r="26" fill="#7B62D6" opacity=".12"/>
  <circle cx="34" cy="30" r="9" fill="#7B62D6" opacity=".28"/>

  <!-- 격자 : 빈 칸 -->
  <g fill="#FFFFFF">
    <rect x="70"  y="30" width="30" height="30" rx="7"/>
    <rect x="104" y="30" width="30" height="30" rx="7"/>
    <rect x="70"  y="64" width="30" height="30" rx="7"/>
    <rect x="138" y="64" width="30" height="30" rx="7"/>
    <rect x="70"  y="98" width="30" height="30" rx="7"/>
    <rect x="206" y="98" width="30" height="30" rx="7"/>
  </g>

  <!-- 격자 : 채운 칸 -->
  <g fill="#7B62D6">
    <rect x="138" y="30" width="30" height="30" rx="7"/>
    <rect x="104" y="98" width="30" height="30" rx="7"/>
    <rect x="138" y="98" width="30" height="30" rx="7"/>
    <rect x="172" y="98" width="30" height="30" rx="7"/>
  </g>
  <g fill="#FFFFFF" opacity=".92">
    <rect x="146" y="40" width="14" height="10" rx="3"/>
    <rect x="112" y="108" width="14" height="10" rx="3"/>
    <rect x="146" y="108" width="14" height="10" rx="3"/>
    <rect x="180" y="108" width="14" height="10" rx="3"/>
  </g>

  <!-- 지금 고른 칸 -->
  <rect x="172" y="30" width="30" height="30" rx="7" fill="#FFFFFF" stroke="#F0913D" stroke-width="4"/>

  <!-- 글자 카드 트레이 -->
  <g fill="#FFFFFF">
    <rect x="104" y="142" width="34" height="26" rx="8"/>
    <rect x="143" y="142" width="34" height="26" rx="8"/>
    <rect x="182" y="142" width="34" height="26" rx="8"/>
  </g>
  <g fill="#7B62D6" opacity=".55">
    <rect x="113" y="151" width="16" height="8" rx="3"/>
    <rect x="152" y="151" width="16" height="8" rx="3"/>
    <rect x="191" y="151" width="16" height="8" rx="3"/>
  </g>
</svg>
